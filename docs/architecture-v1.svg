Warehouse Management &amp; Logistics App - Architecture Baseline
</text>

<!-- Users -->
<rect x="80" y="120" width="320" height="180" rx="15" fill="white" stroke="black" stroke-width="3"/>
<text x="240" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Users</text>
<text x="240" y="195" text-anchor="middle" font-family="Arial" font-size="18">Warehouse Associate</text>
<text x="240" y="225" text-anchor="middle" font-family="Arial" font-size="18">Inventory Controller</text>
<text x="240" y="255" text-anchor="middle" font-family="Arial" font-size="18">Logistics Coordinator</text>
<text x="240" y="285" text-anchor="middle" font-family="Arial" font-size="18">Operations Manager</text>

<!-- Salesforce -->
<rect x="600" y="120" width="600" height="400" rx="15" fill="white" stroke="black" stroke-width="3"/>
<text x="900" y="160" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Salesforce</text>

<text x="900" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Planned Entities</text>
<text x="900" y="240" text-anchor="middle" font-family="Arial" font-size="17">Warehouse • Zone • Bin • Product</text>
<text x="900" y="270" text-anchor="middle" font-family="Arial" font-size="17">Inventory Item • Stock Movement</text>
<text x="900" y="300" text-anchor="middle" font-family="Arial" font-size="17">Shipment • Carrier Event</text>

<text x="900" y="350" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Data &amp; Actions</text>
<text x="900" y="385" text-anchor="middle" font-family="Arial" font-size="17">Receiving → Putaway → Counting</text>
<text x="900" y="415" text-anchor="middle" font-family="Arial" font-size="17">Replenishment → Picking → Packing</text>
<text x="900" y="445" text-anchor="middle" font-family="Arial" font-size="17">Shipping → Exception Handling</text>

<text x="900" y="485" text-anchor="middle" font-family="Arial" font-size="17">Security, Automation, Reporting</text>

<!-- Future Integration -->
<rect x="80" y="430" width="320" height="180" rx="15" fill="white" stroke="black" stroke-width="3"/>
