<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L10,3 L0,6 Z" fill="black"/>
</marker>
</defs>

<text x="900" y="45" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">Warehouse Management &amp; Logistics App - Process Map</text>

<g font-family="Arial" font-size="16" text-anchor="middle">
<rect x="40" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="135" y="135" font-weight="bold">Receiving</text>
<text x="135" y="165">Warehouse Associate</text>
<text x="135" y="190">Input: Inventory</text>
<text x="135" y="210">Output: Received</text>

<rect x="250" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="345" y="135" font-weight="bold">Putaway</text>
<text x="345" y="165">Warehouse Associate</text>
<text x="345" y="190">Input: Received</text>
<text x="345" y="210">Output: Stored</text>

<rect x="460" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="555" y="135" font-weight="bold">Cycle Counting</text>
<text x="555" y="165">Inventory Controller</text>
<text x="555" y="190">Input: Inventory</text>
<text x="555" y="210">Output: Count</text>

<rect x="670" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="765" y="135" font-weight="bold">Replenishment</text>
<text x="765" y="165">Inventory Controller</text>
<text x="765" y="190">Input: Levels</text>
<text x="765" y="210">Output: Task</text>

<rect x="880" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="975" y="135" font-weight="bold">Picking</text>
<text x="975" y="165">Warehouse Associate</text>
<text x="975" y="190">Input: Request</text>
<text x="975" y="210">Output: Picked</text>

<rect x="1090" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="1185" y="135" font-weight="bold">Packing</text>
<text x="1185" y="165">Warehouse Associate</text>
<text x="1185" y="190">Input: Picked</text>
<text x="1185" y="210">Output: Packed</text>

<rect x="1300" y="100" width="190" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="1395" y="135" font-weight="bold">Shipping</text>
<text x="1395" y="165">Logistics Coordinator</text>
<text x="1395" y="190">Input: Packed</text>
<text x="1395" y="210">Output: Shipment</text>

<rect x="1510" y="100" width="240" height="120" rx="10" fill="white" stroke="black" stroke-width="2"/>
<text x="1630" y="135" font-weight="bold">Exception Handling</text>
<text x="1630" y="165">Operations Manager</text>
<text x="1630" y="190">Input: Exception</text>
<text x="1630" y="210">Output: Resolved/Escalated</text>
</g>

<g stroke="black" stroke-width="2" marker-end="url(#arrow)">
<line x1="230" y1="160" x2="250" y2="160"/>
<line x1="440" y1="160" x2="460" y2="160"/>
<line x1="650" y1="160" x2="670" y2="160"/>
<line x1="860" y1="160" x2="880" y2="160"/>
<line x1="1070" y1="160" x2="1090" y2="160"/>
<line x1="1280" y1="160" x2="1300" y2="160"/>
<line x1="1490" y1="160" x2="1510" y2="160"/>
</g>

<g font-family="Arial" font-size="18">
<text x="900" y="300" text-anchor="middle" font-weight="bold">Decisions / Failures / Special Handling</text>
<text x="900" y="340" text-anchor="middle">Inventory discrepancy › Human escalation</text>
<text x="900" y="375" text-anchor="middle">Storage unavailable › Human escalation</text>
<text x="900" y="410" text-anchor="middle">Replenishment required › Scheduled work</text>
<text x="900" y="445" text-anchor="middle">Shipping exception › Integration + Human escalation</text>
<text x="900" y="480" text-anchor="middle">Unresolved operational exception › Human escalation</text>
</g>

<text x="900" y="570" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Start: Receiving -> Putaway -> Cycle Counting -> Replenishment -> Picking -> Packing -> Shipping -> Exception Handling</text>
</svg>

