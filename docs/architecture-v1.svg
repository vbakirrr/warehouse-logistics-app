<text x="240" y="580" text-anchor="middle" font-family="Arial" font-size="18">API / Integration Boundary</text>

<!-- Future Agent -->
<rect x="1400" y="120" width="320" height="180" rx="15" fill="white" stroke="black" stroke-width="3"/>
