<text x="1560" y="200" text-anchor="middle" font-family="Arial" font-size="18">Operational Assistant</text>
<text x="1560" y="235" text-anchor="middle" font-family="Arial" font-size="18">Exception Support</text>
<text x="1560" y="270" text-anchor="middle" font-family="Arial" font-size="18">Decision Assistance</text>

<!-- Entity classification -->
<rect x="600" y="590" width="1120" height="360" rx="15" fill="white" stroke="black" stroke-width="3"/>
<text x="1160" y="630" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">Entity Classification</text>

<text x="630" y="675" font-family="Arial" font-size="18" font-weight="bold">Standard Object Candidates:</text>
<text x="900" y="675" font-family="Arial" font-size="18">Product, Shipment</text>

<text x="630" y="725" font-family="Arial" font-size="18" font-weight="bold">Custom Object Candidates:</text>
<text x="930" y="725" font-family="Arial" font-size="18">Warehouse, Zone, Bin, Inventory Item, Stock Movement</text>

<text x="630" y="775" font-family="Arial" font-size="18" font-weight="bold">External Object Candidate:</text>
<text x="930" y="775" font-family="Arial" font-size="18">Carrier Event</text>

<text x="630" y="825" font-family="Arial" font-size="18" font-weight="bold">File / Document Concept:</text>
